{% extends "base.html" %}

{% block title %}
Apply for Hostel | GridAlloc
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm p-4">

                <h2 class="fw-bold">
                    Hostel Application
                </h2>

                <p class="text-muted">
                    Submit your hostel preferences.
                </p>


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Preferred Hostel
                        </label>

                        <select
                            name="hostel"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Hostel
                            </option>
                            {% for hostel in hostels %}

                            <option value="{{ hostel.id }}">
                                {{ hostel.name }}
                                - 3 Sharing: {{ hostel.available_3_sharing }} beds
                                - 4 Sharing: {{ hostel.available_4_sharing }} beds
                            </option>

                            {% endfor %}
                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Room Preference
                        </label>

                        <select
                            name="room_preference"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select preference
                            </option>

                            <option value="3">
                                3 Sharing
                            </option>

                            <option value="4">
                                4 Sharing
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Reason / Additional Information
                        </label>

                        <textarea
                            name="reason"
                            class="form-control"
                            rows="4"
                            placeholder="Optional"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Submit Application
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
